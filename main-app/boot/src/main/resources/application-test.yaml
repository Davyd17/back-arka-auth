spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:15:///arka_auth_test
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed/test
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
