server:
  port: 8081
  address: 0.0.0.0

spring:

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  application:
    name: "back-auth-service"

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      autoCommit: true
      connectionTimeout: 30000
      idleTimeout: 600000
      keepaliveTime: 120000
      maxLifetime: 1800000
      maximumPoolSize: 50
      minimumIdle: 8
      poolName: PoolConnection-ArkaProyect-Auth
      leakDetectionThreshold: 30000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt-provider:
  expiration-date : 3600000
  secret: ${JWT_SECRET}
  password-rest:
    token-expiration-minutes: 30

cloud-provider:
  aws:
    s3:
      bucket-name: ${BUCKET_NAME}
      objects:
        email-verification-template: ${S3_VERIFICATION_EMAIL_TEMPLATE}
        email-password-reset-template: ${S3_PASSWORD_RESET_TEMPLATE}

notifications:
  email-settings:
    sender: ${EMAIL_SENDER}
    verification-code:
      code-expiration-ms: 900000
      subject: Verification code from Arka
    password-reset:
      token-expiration-ms: 300000
      subject: Reset password request from Arka


springdoc:
  swagger-ui:
    path: "/auth/swagger-ui.html"
    config-url: /auth/v3/api-docs/swagger-config
    url: /auth/v3/api-docs
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none
    defaultModelsExpandDepth: -1
  api-docs:
    path: /auth/v3/api-docs

api:
  base-url: ${API_BASE_URL}

logging:
  level:
    com.arka: DEBUG
