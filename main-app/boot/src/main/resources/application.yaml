server:
  port: 8081

spring:
  jackson:
    time-zone: UTC
  application:
    name: "back-auth-service"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      autoCommit: true
      connectionTimeout: 30000
      idleTimeout: 600000
      keepaliveTime: 120000
      maxLifetime: 1800000
      maximumPoolSize: 50
      minimumIdle: 8
      poolName: PoolConnection-ArkaProyect-Auth
      leakDetectionThreshold: 30000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  sql:
    init:
      #Turn to never ones created the schema and papulated the data to avoid duplication errors
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt-provider:
  expiration-date : 3600000
  secret: ${JWT_SECRET}
  password-rest:
    token-expiration-minutes: 30

cloud-provider:
  aws:
    s3:
      bucket-name:
        objects:
          templateHtml: ${S3_BUCKET_NAME:my-bucket}
    ses:
      sender: ${SES_SENDER_EMAIL:juansecabreram10@gmail.com}
springdoc:
  swagger-ui:
    path: "/swagger-ui.html"

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.arka: DEBUG
