pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

rootProject.name = 'back-auth-service'

include(":boot",
        ":api-rest",
        ":aws-provider",
        ":security-provider",
        ":jpa-repository",
        ":usecase",
        ":model",
        ":security",
        ":core-service-provider"
)

project(":boot").projectDir = file("./main-app/boot")

project(":jpa-repository").projectDir = file("./infrastructure/driven-adapters/jpa-repository")
project(":aws-provider").projectDir = file("./infrastructure/driven-adapters/aws-provider")
project(":security-provider").projectDir = file("./infrastructure/driven-adapters/security-provider")
project(":core-service-provider").projectDir = file("./infrastructure/driven-adapters/core-service-provider")

project(":api-rest").projectDir = file("./infrastructure/entry-points/api-rest")
project(":security").projectDir = file("./infrastructure/entry-points/security")

project(":usecase").projectDir = file("./domain/usecase")
project(":model").projectDir = file("./domain/model")
